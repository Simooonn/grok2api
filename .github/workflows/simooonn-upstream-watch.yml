name: Simooonn Upstream Watch

# Fork-only: daily, compare this fork's release branch against upstream main and,
# while release is behind, post the unsynced upstream commits to Lark.
# Stateless: the reminder repeats until release is synced.
# Required repository secrets: LARK_WEBHOOK_URL, LARK_SECRET (signing).
# This file lives only on the fork's main (default branch). "Sync fork > Update
# branch" keeps it; "Discard commits" or --force deletes it.

on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read

env:
  UPSTREAM: chenyme/grok2api
  FORK_BRANCH: release
  MAX_LINES: 20

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post unsynced upstream commits to Lark
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
        run: |
          missing=''
          [ -n "$LARK_WEBHOOK_URL" ] || missing="$missing LARK_WEBHOOK_URL"
          [ -n "$LARK_SECRET" ] || missing="$missing LARK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

          # Compare Simooonn:release against chenyme:main
          compare=$(gh api "repos/$UPSTREAM/compare/$GITHUB_REPOSITORY_OWNER:$FORK_BRANCH...${UPSTREAM%%/*}:main")
          ahead=$(jq -er '.ahead_by | numbers' <<<"$compare")
          if [ "$ahead" -eq 0 ]; then
            echo "Fork $FORK_BRANCH is in sync with $UPSTREAM; nothing to notify."
            exit 0
          fi

          # Lark custom bot signing: HMAC-SHA256 keyed by "timestamp\nsecret" over an empty body.
          timestamp=$(date +%s)
          sign=$(printf '' | openssl dgst -sha256 -hmac "$timestamp"$'\n'"$LARK_SECRET" -binary | base64)

          # Compare lists commits oldest first; show the newest MAX_LINES, newest first, in UTC+8.
          # Author is the GitHub login; fall back to the git author name when the email has no account.
          payload=$(jq -c --arg ts "$timestamp" --arg sign "$sign" --arg upstream "$UPSTREAM" \
            --arg branch "$FORK_BRANCH" --argjson max "$MAX_LINES" '
            .ahead_by as $n
            | [.commits[-$max:] | reverse[]
                | (.commit.committer.date | fromdate + 28800 | strftime("%Y-%m-%d %H:%M")) as $time
                | [{tag: "text", text: "\(.sha[0:7])  \($time)  \(.author.login // .commit.author.name): \(.commit.message | split("\n")[0])"}]
              ] as $lines
            | {
                timestamp: $ts,
                sign: $sign,
                msg_type: "post",
                content: {post: {zh_cn: {
                  title: "上游 \($upstream) 有 \($n) 个提交未同步到 fork \($branch)",
                  content: ($lines
                    + (if $n > ($lines | length) then [[{tag: "text", text: "……另有 \($n - ($lines | length)) 个更早的提交未列出"}]] else [] end)
                    + [[{tag: "a", text: "查看全部差异", href: .html_url}]])
                }}}
              }' <<<"$compare")

          if ! response=$(curl -sS --fail-with-body --max-time 30 -H 'Content-Type: application/json' \
            -d "$payload" "$LARK_WEBHOOK_URL") ||
            [ "$(jq -r '.code // .StatusCode' <<<"$response" 2>/dev/null)" != 0 ]; then
            echo "::error::Lark rejected the message: ${response:-no response}"
            exit 1
          fi
          echo "Posted $ahead unsynced commit(s) to Lark."
